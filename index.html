"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Forty years of an offshore wind project<\u002Ftitle>\n\n<style>\n  :root{\n    --paper:#eceeea;\n    --paper-2:#e3e6e0;\n    --ink:#151d1a;\n    --sub:#495450;\n    --line:#c7cdc5;\n    --green:#2f7d5a;\n    --green-deep:#245f45;\n    --pill:#0f1c18;\n    --pill-ink:#eff4f0;\n    --focus:#1f6f4c;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    background:var(--paper);\n    color:var(--ink);\n    font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;\n    line-height:1.5;\n    -webkit-font-smoothing:antialiased;\n  }\n  .wrap{\n    max-width:960px;\n    margin:0 auto;\n    padding:28px 20px 56px;\n  }\n  header.intro{margin-bottom:20px;}\n  .kicker{\n    font-size:12px;\n    letter-spacing:.14em;\n    text-transform:uppercase;\n    color:var(--green-deep);\n    font-weight:600;\n    margin:0 0 10px;\n  }\n  .drag-hint{\n    font-size:14px;\n    color:var(--sub);margin:0;letter-spacing:.01em;\n  }\n  h1{\n    font-family:Georgia,\"Times New Roman\",serif;\n    font-weight:600;\n    font-size:clamp(24px,4.4vw,38px);\n    line-height:1.12;\n    letter-spacing:-.01em;\n    margin:0 0 12px;\n    text-wrap:balance;\n  }\n  .standfirst{\n    font-family:Georgia,\"Times New Roman\",serif;\n    font-size:clamp(15px,2.2vw,18px);\n    color:var(--sub);\n    max-width:62ch;\n    margin:0;\n    text-wrap:pretty;\n  }\n  .stage-wrap{\n    position:relative;\n    overflow:hidden;\n    background:#dfe4dd;\n    border-radius:11px 11px 0 0;\n  }\n  /* video-player shell wrapping the scene + scrubber bar */\n  .player{\n    margin-top:20px;\n    border:1px solid var(--line);\n    border-radius:12px;\n    overflow:hidden;\n    box-shadow:0 10px 30px rgba(20,29,26,.10);\n    background:var(--pill);\n  }\n  canvas{display:block;width:100%;height:auto;touch-action:pan-y;}\n  /* the scrubber / control bar, styled like a video player transport */\n  .player-bar{\n    background:#0f1c18;\n    padding:14px 18px 12px;\n  }\n  .mute-btn{\n    position:absolute;top:12px;right:12px;z-index:6;\n    width:40px;height:40px;border-radius:50%;\n    display:flex;align-items:center;justify-content:center;\n    background:rgba(15,28,24,.62);color:#eff4f0;\n    border:1px solid rgba(255,255,255,.28);cursor:pointer;\n    backdrop-filter:blur(3px);transition:background .2s ease;\n  }\n  .mute-btn:hover{background:rgba(15,28,24,.85);}\n  .mute-btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}\n  .mute-btn svg{width:20px;height:20px;}\n  /* year badge on the canvas */\n  .yearbadge{\n    position:absolute;top:12px;left:12px;\n    background:var(--pill);color:var(--pill-ink);\n    border-radius:8px;padding:8px 12px;\n    display:flex;align-items:baseline;gap:8px;\n    pointer-events:none;\n  }\n  .yearbadge .yr{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;}\n  .yearbadge .of{white-space:nowrap;}\n  .yearbadge .of{font-size:12px;opacity:.72;letter-spacing:.02em;}\n  /* carousel arrows over the asset */\n  .carousel-btn{\n    position:absolute;top:50%;transform:translateY(-50%);z-index:5;\n    width:46px;height:46px;border-radius:50%;\n    display:flex;align-items:center;justify-content:center;\n    background:rgba(15,28,24,.62);color:#eff4f0;\n    border:1px solid rgba(255,255,255,.28);cursor:pointer;\n    backdrop-filter:blur(3px);\n    transition:background .2s ease,transform .2s ease,opacity .2s ease;\n  }\n  .carousel-btn:hover{background:rgba(15,28,24,.85);}\n  .carousel-btn:active{transform:translateY(-50%) scale(.94);}\n  .carousel-btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}\n  .carousel-btn:disabled{opacity:.28;cursor:default;}\n  .carousel-btn.prev{left:12px;}\n  .carousel-btn.next{right:12px;}\n  .carousel-btn svg{width:22px;height:22px;}\n  @media (max-width:520px){\n    .carousel-btn{width:40px;height:40px;}\n    .carousel-btn.prev{left:8px;}.carousel-btn.next{right:8px;}\n  }\n\n  /* ---- timeline slider (inside dark player bar) ---- */\n  .bar-head{\n    display:flex;justify-content:flex-end;align-items:center;\n    gap:12px;margin-bottom:8px;\n  }\n  .bar-head .lbl{font-size:12px;color:rgba(239,244,240,.72);letter-spacing:.02em;font-variant-numeric:tabular-nums;}\n  .slider-wrap{position:relative;height:40px;user-select:none;}\n  .yearmarks{position:relative;height:16px;margin-top:6px;}\n  .yearmark{position:absolute;top:0;transform:translateX(-50%);\n    font-size:10.5px;font-variant-numeric:tabular-nums;color:rgba(239,244,240,.62);white-space:nowrap;}\n  .yearmark:first-child{transform:translateX(0);}\n  .yearmark:last-child{transform:translateX(-100%);}\n  .segbar{\n    position:absolute;left:0;right:0;top:8px;height:18px;\n    display:flex;border-radius:5px;overflow:hidden;\n    border:1px solid rgba(255,255,255,.14);\n  }\n  .seg{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}\n  .seg.active{outline:2px solid var(--ink);outline-offset:-2px;}\n  input[type=range]{\n    position:absolute;left:-2px;right:-2px;top:-6px;width:calc(100% + 4px);height:38px;margin:0;\n    background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;\n  }\n  input[type=range]:focus{outline:none;}\n  input[type=range]::-webkit-slider-runnable-track{background:transparent;height:38px;}\n  input[type=range]::-moz-range-track{background:transparent;height:38px;}\n  input[type=range]::-webkit-slider-thumb{\n    -webkit-appearance:none;appearance:none;\n    width:22px;height:38px;border:none;background:transparent;cursor:grab;\n  }\n  input[type=range]::-moz-range-thumb{\n    width:22px;height:38px;border:none;background:transparent;cursor:grab;\n  }\n  input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;}\n  .thumb{\n    position:absolute;top:-6px;width:8px;height:38px;pointer-events:none;\n    transform:translateX(-50%);\n  }\n  .thumb .stem{position:absolute;left:50%;top:0;width:3px;height:38px;transform:translateX(-50%);background:#eff4f0;border-radius:2px;}\n  .thumb .knob{\n    position:absolute;left:50%;top:50%;width:26px;height:26px;border-radius:50%;\n    transform:translate(-50%,-50%);background:var(--green);border:3px solid #0f1c18;\n    box-shadow:0 1px 3px rgba(0,0,0,.45);\n  }\n  input[type=range]:focus-visible ~ .thumb .knob{\n    outline:3px solid var(--focus);outline-offset:3px;\n  }\n  .ticks{position:absolute;left:0;right:0;top:8px;height:18px;pointer-events:none;}\n  .tick{position:absolute;top:-3px;width:1px;height:24px;background:rgba(239,244,240,.4);}\n\n  .stepnav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}\n  .stepnav button{\n    font:inherit;font-size:13px;font-weight:600;\n    background:var(--paper-2);color:var(--ink);\n    border:1px solid var(--line);border-radius:8px;\n    min-height:44px;padding:0 14px;cursor:pointer;\n    display:inline-flex;align-items:center;gap:6px;\n  }\n  .stepnav button:hover{border-color:var(--sub);}\n  .stepnav button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}\n  .stepnav button:disabled{opacity:.4;cursor:default;}\n  .stepnav .spacer{flex:1;}\n\n  /* ---- stage panel ---- */\n  .panel{margin-top:30px;}\n  .panel-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:4px;}\n  .panel-head h2{\n    font-family:Georgia,\"Times New Roman\",serif;font-weight:600;\n    font-size:clamp(20px,3vw,27px);margin:0;letter-spacing:-.01em;\n    transition:opacity .28s ease;\n  }\n  .panel-head .dur{\n    font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;\n    color:#fff;background:var(--green);border-radius:20px;padding:4px 11px;\n    transition:opacity .28s ease;\n  }\n  .fields{\n    display:flex;flex-direction:column;\n    border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:16px;\n    background:var(--line);gap:1px;\n    transition:opacity .18s ease;\n  }\n  .acc-hint{\n    margin:16px 0 0;font-size:13px;color:var(--sub);font-style:italic;\n  }\n  .acc-hint + .fields{margin-top:8px;}\n  .fields.fade{opacity:0;}\n  .acc{background:var(--paper);}\n  .acc-head{\n    width:100%;display:flex;align-items:center;gap:12px;\n    background:none;border:none;text-align:left;cursor:pointer;\n    padding:14px 16px;min-height:52px;font:inherit;color:var(--ink);\n  }\n  .acc-head:hover{background:var(--paper-2);}\n  .acc-head:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;}\n  .acc-head .flabel{\n    flex:1;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;\n    color:var(--green-deep);margin:0;\n  }\n  .acc-head .chev{\n    flex:none;width:18px;height:18px;color:var(--sub);\n    transition:transform .28s cubic-bezier(.16,1,.3,1);\n  }\n  .acc.open .acc-head .chev{transform:rotate(90deg);}\n  .acc-body{\n    display:grid;grid-template-rows:0fr;\n    transition:grid-template-rows .3s cubic-bezier(.16,1,.3,1);\n  }\n  .acc.open .acc-body{grid-template-rows:1fr;}\n  .acc-body>div{overflow:hidden;}\n  .acc-body .fval{\n    font-size:15px;margin:0;padding:0 16px 16px;color:var(--ink);text-wrap:pretty;\n  }\n  @media (prefers-reduced-motion:reduce){\n    .acc-body,.acc-head .chev{transition:none;}\n  }\n\n  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}\n\n  footer.note{margin-top:34px;font-size:12.5px;color:var(--sub);border-top:1px solid var(--line);padding-top:14px;max-width:70ch;}\n  footer.note strong{color:var(--ink);font-weight:600;}\n\n  @media (max-width:520px){\n    .wrap{padding:22px 15px 44px;}\n    .field .fval{font-size:14.5px;}\n  }\n\n  /* ---- cover page ---- */\n  body.cover-on{overflow:hidden;}\n  .cover{\n    position:fixed;inset:0;z-index:1000;overflow:hidden;background:#003c37;\n    transition:opacity .5s cubic-bezier(.22,.61,.36,1);\n    font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;\n  }\n  .cover.leaving{opacity:0;pointer-events:none;}\n  .cover-veil{position:absolute;inset:0;pointer-events:none;\n    background:linear-gradient(90deg,rgba(0,60,55,.62) 44%,rgba(0,60,55,.34) 66%,rgba(0,60,55,0) 94%);}\n  .cover-panel{\n    position:absolute;left:0;top:0;bottom:0;width:clamp(280px,54%,600px);\n    background:#004c46;color:#fff;overflow:hidden;\n    display:flex;flex-direction:column;justify-content:center;\n    padding:34px clamp(22px,4vw,46px);\n    box-shadow:26px 0 62px rgba(0,44,40,.44);\n    transition:transform .55s cubic-bezier(.16,1,.3,1);\n  }\n  .cover.leaving .cover-panel{transform:translateX(-7%) scale(.985);}\n  .cover-panel>*{position:relative;z-index:1;}\n  .cover-eyebrow{display:flex;align-items:center;gap:8px;white-space:nowrap;margin:0;\n    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;}\n  .cover-eyebrow:before{content:'';width:7px;height:7px;border-radius:50%;background:#b8d87a;flex:none;}\n  .cover-panel h2{font-family:Georgia,\"Times New Roman\",serif;font-weight:400;\n    font-size:clamp(26px,3.9vw,42px);line-height:1.1;letter-spacing:-.025em;margin:16px 0 0;color:#fff;text-wrap:balance;}\n  .cover-lede{font-size:clamp(14px,1.5vw,17px);line-height:1.55;color:#deeadf;max-width:42ch;margin:16px 0 0;text-wrap:pretty;}\n  .cover-start{align-self:flex-start;display:inline-flex;align-items:center;gap:9px;\n    min-height:48px;margin-top:28px;padding:12px 22px;border-radius:999px;\n    border:1px solid #b8d87a;background:#7cc24d;color:#00352f;\n    font-size:16px;font-weight:600;line-height:1.2;box-shadow:0 10px 26px rgba(0,44,40,.34);cursor:pointer;\n    transition:background .2s ease,transform .2s ease;}\n  .cover-start:hover{background:#b8d87a;transform:translateY(-1px);}\n  .cover-start:active{transform:translateY(1px);}\n  .cover-start:focus-visible{outline:3px solid #7cc24d;outline-offset:3px;}\n  .cover-pill{position:absolute;left:clamp(22px,4vw,46px);bottom:26px;z-index:1;\n    border:1px solid rgba(166,198,184,.75);border-radius:999px;padding:7px 14px;font-size:12px;color:#fff;}\n  .cover-fold{position:absolute;right:0;bottom:0;z-index:0;pointer-events:none;overflow:hidden;\n    width:min(74%,330px);height:min(58%,290px);}\n  .cover-fold span{position:absolute;inset:0;}\n  .cover-fold .f-under{background:#00774c;clip-path:polygon(100% 14%,100% 100%,60% 100%);}\n  .cover-fold .f-shadow{background:#003c2e;clip-path:polygon(39% 54%,70% 35%,60% 100%);}\n  .cover-fold .f-fold{background:#7cc24d;clip-path:polygon(47% 42%,100% 14%,60% 100%);}\n  @media(max-width:760px){\n    .cover-panel{width:80%;}\n    .cover-veil{background:linear-gradient(90deg,rgba(0,60,55,.62) 62%,rgba(0,60,55,0) 100%);}\n    .cover-pill{display:none;}\n  }\n  @media(max-width:420px){.cover-panel{width:100%;padding:26px 18px;}}\n  @media(prefers-reduced-motion:reduce){.cover,.cover-panel{transition:none;}}\n<\u002Fstyle>\n<\u002Fhead>\n<body class=\"cover-on\">\n<div class=\"cover\" id=\"cover\">\n  <div class=\"cover-veil\" aria-hidden=\"true\"><\u002Fdiv>\n  <div class=\"cover-panel\">\n    <div class=\"cover-fold\" aria-hidden=\"true\">\n      <span class=\"f-under\"><\u002Fspan><span class=\"f-shadow\"><\u002Fspan><span class=\"f-fold\"><\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"cover-eyebrow\">Offshore wind · project lifecycle<\u002Fp>\n    <h2>Forty years of an offshore wind project<\u002Fh2>\n    <p class=\"cover-lede\">Drag the slider through the project’s 40-year life to see what’s happening, who’s working and what you’d notice from shore at each of its four stages.<\u002Fp>\n    <button class=\"cover-start\" id=\"coverStart\" type=\"button\">\n      Start exploring\n      <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wrap\">\n  <header class=\"intro\">\n    <p class=\"kicker\">Offshore wind · project lifecycle<\u002Fp>\n    <p class=\"drag-hint\">Drag through the project year or use the buttons to navigate through the project lifecycle stages.<\u002Fp>\n  <\u002Fheader>\n\n  <div class=\"player\">\n    <div class=\"stage-wrap\">\n      <canvas id=\"scene\" aria-hidden=\"true\"><\u002Fcanvas>\n      <div class=\"yearbadge\"><span class=\"yr\" id=\"badgeYear\">Year 0<\u002Fspan><span class=\"of\" id=\"badgeStage\">Development<\u002Fspan><\u002Fdiv>\n      <button class=\"carousel-btn prev\" id=\"prevBtn\" type=\"button\" aria-label=\"Previous stage\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n      <button class=\"carousel-btn next\" id=\"nextBtn\" type=\"button\" aria-label=\"Next stage\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n      <button class=\"mute-btn\" id=\"muteBtn\" type=\"button\" aria-label=\"Mute sound\" aria-pressed=\"false\"><\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"player-bar\">\n      <div class=\"bar-head\">\n        <span class=\"lbl\" id=\"rangeHint\">Year 0 of 40<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"slider-wrap\">\n        <div class=\"segbar\" id=\"segbar\" aria-hidden=\"true\"><\u002Fdiv>\n        <div class=\"ticks\" id=\"ticks\" aria-hidden=\"true\"><\u002Fdiv>\n        <input type=\"range\" id=\"year\" min=\"0\" max=\"40\" step=\"0.1\" value=\"0\" aria-label=\"Project year, 0 to 40\">\n        <div class=\"thumb\" id=\"thumb\"><span class=\"stem\"><\u002Fspan><span class=\"knob\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"yearmarks\" id=\"yearmarks\" aria-hidden=\"true\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section class=\"panel\" aria-label=\"Current stage detail\">\n    <div class=\"panel-head\">\n      <h2 id=\"pName\">Development<\u002Fh2>\n      <span class=\"dur\" id=\"pDur\">Years 1 to 10<\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"acc-hint\">Expand the information boxes below to learn more information.<\u002Fp>\n    <div class=\"fields\" id=\"fields\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <div class=\"sr-only\" aria-live=\"polite\" id=\"live\"><\u002Fdiv>\n\n  <footer class=\"note\">\n    <strong>How to read this.<\u002Fstrong> The coloured bar in the player is the timeline drawn to scale: the wide green band is operations and maintenance, the quiet 25 to 30 years when the turbines simply turn. Development and the two short bursts of building and dismantling sit either side of it.\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<script>\n(function(){\n\"use strict\";\n\n/* ---------------------------------------------------------------\n   CONTENT (verbatim from source)\n--------------------------------------------------------------- */\nconst STAGES = [\n  {\n    key:\"dev\", name:\"Development\", chip:\"Years 1 to 10\",\n    start:0, end:10, center:5,\n    live:\"For years the project is measured, designed and approved before anything is built.\",\n    fields:[\n      [\"What's happening\",\"Wind, seabed and marine life measured across years; existing sea users identified and consulted; cultural heritage assessment begun; grid connection investigated; the project designed, costed and financed.\",true],\n      [\"Who's working\",\"Ecologists, marine scientists, surveyors, engineers, planners, cultural heritage specialists, engagement staff and analysts.\",false],\n      [\"What you'd see from shore\",\"A survey vessel, occasionally. Nothing else.\",false],\n      [\"How long\",\"Five to 10 years.\",false],\n      [\"Before the next stage\",\"Environmental approval, a commercial licence, a grid connection and a final investment decision.\",false],\n    ]\n  },\n  {\n    key:\"con\", name:\"Construction\", chip:\"Two to four years\",\n    start:10, end:13, center:11.5,\n    live:\"In a short, intense burst the foundations, turbines and cables are installed and connected.\",\n    fields:[\n      [\"What's happening\",\"Foundations installed, turbines assembled and erected, array and export cables laid and buried, offshore substation placed, landfall built, the whole thing commissioned.\",true],\n      [\"Who's working\",\"The largest workforce of any stage, on vessels, at ports and onshore, mostly employed by contractors rather than the developer.\",false],\n      [\"What you'd see from shore\",\"Port activity, heavy transport on local roads, vessels working on the horizon, cable works at the landfall.\",false],\n      [\"How long\",\"Two to four years.\",false],\n      [\"Before the next stage\",\"Commissioning complete and the connection energised.\",false],\n    ]\n  },\n  {\n    key:\"om\", name:\"Operations and maintenance\", chip:\"25 to 30 years\",\n    start:13, end:38, center:25.5,\n    live:\"For decades the turbines simply turn, tended by a small local crew going out and back each day.\",\n    fields:[\n      [\"What's happening\",\"Scheduled maintenance, unscheduled repair, remote monitoring, warehousing and logistics.\",true],\n      [\"Who's working\",\"Technicians, vessel crews, control room staff, schedulers, logistics and warehouse staff, based at a permanent local operations base.\",false],\n      [\"What you'd see from shore\",\"Crew transfer vessels leaving in the morning and returning at night, and the turbines turning.\",false],\n      [\"How long\",\"25 to 30 years.\",false],\n      [\"Before the next stage\",\"The end of the operating life, and a decision about what replaces it.\",false],\n    ]\n  },\n  {\n    key:\"dec\", name:\"Decommissioning or repowering\", chip:\"Two to three years\",\n    start:38, end:40, center:40,\n    live:\"At the end of its life the project is taken down and removed, or rebuilt on the same connection.\",\n    fields:[\n      [\"What's happening\",\"Disconnection from the grid, dismantling, removal, and either site rehabilitation or installation of newer turbines on the existing connection.\",true],\n      [\"Who's working\",\"Heavy lift and marine construction crews again, plus recycling and waste specialists.\",false],\n      [\"What you'd see from shore\",\"The reverse of construction.\",false],\n      [\"How long\",\"Two to three years.\",false],\n      [\"What has to be true first\",\"A regulatory and economic decision made decades from now, which no project can promise today.\",false],\n    ]\n  },\n];\nconst SEG_COLORS = [\"#5b7f70\",\"#3f8f6b\",\"#2f7d5a\",\"#7a8b6f\"];\n\n/* ---------------------------------------------------------------\n   PALETTE + colour helpers\n--------------------------------------------------------------- */\nfunction hx(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}\nconst PAL = {\n  skyTop:hx('#b9c6c2'), skyLow:hx('#dbe1da'),\n  sea:hx('#65817e'), seaFar:hx('#9fb2ac'), seaDeep:hx('#3b524f'),\n  green:hx('#2f7d5a'), ink:hx('#16211d'), light:hx('#eff3ee'),\n  sun:hx('#f2efe2'), land:hx('#4c574c')\n};\nfunction mix(a,b,t){t=Math.max(0,Math.min(1,t));return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}\nfunction rgb(c,a){return a==null?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;}\nfunction clamp(v,a,b){return v<a?a:v>b?b:v;}\nfunction smooth(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);}\nfunction lerp(a,b,t){return a+(b-a)*t;}\n\n/* ---------------------------------------------------------------\n   CANVAS setup\n--------------------------------------------------------------- */\nconst canvas=document.getElementById('scene');\nconst ctx=canvas.getContext('2d');\nlet CSSW=0, CSSH=0, DPR=1;\nfunction resize(){\n  const wrap=canvas.parentElement;\n  CSSW=wrap.clientWidth;\n  CSSH=Math.round(clamp(CSSW*0.58, 240, 540));\n  DPR=Math.min(2, window.devicePixelRatio||1);\n  canvas.width=Math.round(CSSW*DPR);\n  canvas.height=Math.round(CSSH*DPR);\n  canvas.style.height=CSSH+'px';\n}\nwindow.addEventListener('resize',resize);\n\n/* ---------------------------------------------------------------\n   GEOMETRY  — everything derived from CSSW / CSSH\n--------------------------------------------------------------- */\nconst NT=6;\nfunction geo(){\n  const w=CSSW,h=CSSH;\n  const horizon=h*0.50;\n  const shoreY=h*0.985;\n  const g={w,h,horizon,shoreY};\n  g.sunX=w*0.74; g.sunY=h*0.24;\n  // turbines strung along the horizon, receding to the right\n  g.turb=[];\n  for(let i=0;i<NT;i++){\n    const d=i/(NT-1);                 // 0 near .. 1 far\n    const x=lerp(w*0.30, w*1.02, d);\n    const sc=lerp(1.0, 0.5, d);\n    const baseY=horizon - h*0.005 + d*h*0.01;\n    g.turb.push({x,baseY,sc,d,towerH:h*0.28*sc, hairScale:sc});\n  }\n  // offshore substation, between shore and array\n  g.sub={x:w*0.20,baseY:horizon+h*0.02,sc:0.9};\n  // mid-sea vessel lane (where working boats sit)\n  g.vesselY=lerp(horizon, shoreY, 0.5);\n  g.landfallX=w*0.12;\n  return g;\n}\n\n/* ---------------------------------------------------------------\n   STATE + CAMERA\n--------------------------------------------------------------- */\nlet year=0;                 // authoritative value (driven by slider)\nconst cam={fx:0.5, lz:0, ready:false};   // fx frac, lz = log zoom\nconst CAMTARGETS=[          // per stage: focus x fraction, zoom\n  {fx:0.52, z:1.10},        // dev\n  {fx:0.40, z:1.34},        // con\n  {fx:0.60, z:1.04},        // om\n  {fx:0.46, z:1.30},        // dec\n];\nfunction camTargetFor(y){\n  const c=STAGES.map(s=>s.center);\n  if(y<=c[0]) return CAMTARGETS[0];\n  if(y>=c[3]) return CAMTARGETS[3];\n  for(let i=0;i<3;i++){\n    if(y<=c[i+1]){\n      const t=smooth(c[i],c[i+1],y);\n      return {fx:lerp(CAMTARGETS[i].fx,CAMTARGETS[i+1].fx,t),\n              z:Math.exp(lerp(Math.log(CAMTARGETS[i].z),Math.log(CAMTARGETS[i+1].z),t))};\n    }\n  }\n  return CAMTARGETS[3];\n}\n// stage focus strength for element crossfade\nfunction strength(s,y){\n  if(y>=s.start && y<=s.end) return 1;\n  const d = y<s.start ? s.start-y : y-s.end;\n  return clamp(1 - d/3.0, 0, 1);\n}\n\nconst reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst AMB=reduceMotion?0.25:1;\n\nlet curFocusX=0, curFocusY=0, curZoom=1;\nfunction worldToScreen(wx,wy){\n  return [(wx-curFocusX)*curZoom + CSSW/2, (wy-curFocusY)*curZoom + CSSH/2];\n}\n\n/* ---------------------------------------------------------------\n   DRAW helpers\n--------------------------------------------------------------- */\nfunction fillTurbine(g,t,p,angle,alpha,H){\n  if(alpha<=0.001) return;\n  ctx.save();\n  ctx.globalAlpha*=alpha;\n  const towerBuild=smooth(0.04,0.62,p);\n  const towerH=t.towerH*towerBuild;\n  const topY=t.baseY-towerH;\n  const tw=Math.max(1.2, t.towerH*0.045);\n  // atmospheric perspective: distant turbines wash toward the haze\n  const haze=t.d;\n  const towerDark=mix(mix(PAL.ink,PAL.seaDeep,0.25), PAL.skyLow, haze*0.55);\n  const towerLite=mix(mix(PAL.light,PAL.seaFar,0.35), PAL.skyLow, haze*0.55);\n  // foundation / transition piece just above water, with its own shading + waterline\n  if(p>0.12){\n    const fh=t.towerH*0.11;\n    const fg=ctx.createLinearGradient(t.x-tw, 0, t.x+tw, 0);\n    fg.addColorStop(0, rgb(mix(towerDark,PAL.ink,0.3)));\n    fg.addColorStop(0.5, rgb(mix(towerDark,PAL.green,0.22)));\n    fg.addColorStop(1, rgb(mix(towerLite,PAL.green,0.15)));\n    ctx.fillStyle=fg;\n    ctx.fillRect(t.x-tw*0.9, t.baseY-fh, tw*1.8, fh);\n    // waterline shadow band\n    ctx.fillStyle=rgb(PAL.ink,0.28*alpha);\n    ctx.fillRect(t.x-tw*0.9, t.baseY-fh*0.18, tw*1.8, fh*0.22);\n  }\n  // tapered tower with a cylindrical gradient (shadow left, light right, slim specular)\n  const tg=ctx.createLinearGradient(t.x-tw, 0, t.x+tw, 0);\n  tg.addColorStop(0, rgb(mix(towerDark,PAL.ink,0.35)));\n  tg.addColorStop(0.42, rgb(towerDark));\n  tg.addColorStop(0.72, rgb(towerLite));\n  tg.addColorStop(0.9, rgb(mix(towerLite,PAL.light,0.5)));\n  tg.addColorStop(1, rgb(towerDark));\n  ctx.fillStyle=tg;\n  ctx.beginPath();\n  ctx.moveTo(t.x-tw*0.75, t.baseY);\n  ctx.lineTo(t.x-tw*0.42, topY);\n  ctx.lineTo(t.x+tw*0.42, topY);\n  ctx.lineTo(t.x+tw*0.75, t.baseY);\n  ctx.closePath();\n  ctx.fill();\n  // nacelle + blades\n  if(p>0.6){\n    const na=smooth(0.6,0.78,p);\n    const hubX=t.x, hubY=topY;\n    const bl=t.towerH*0.5*smooth(0.6,1,p);\n    const bw=Math.max(1.4,tw*0.85);\n    // blades as tapered filled shapes with a two-tone edge for depth\n    for(let b=0;b<3;b++){\n      const a=angle + b*(Math.PI*2/3);\n      const ex=hubX+Math.cos(a)*bl, ey=hubY+Math.sin(a)*bl;\n      const nx=-Math.sin(a), ny=Math.cos(a);\n      const rootW=bw*0.95, tipW=bw*0.18;\n      // light comes from upper-right: face angle vs light dir sets tone\n      const face=Math.cos(a - (-2.2));\n      const bladeCol=mix(mix(PAL.green,PAL.ink,0.25), mix(PAL.light,PAL.green,0.35), (face+1)/2);\n      ctx.fillStyle=rgb(bladeCol);\n      ctx.beginPath();\n      ctx.moveTo(hubX+nx*rootW, hubY+ny*rootW);\n      ctx.lineTo(ex+nx*tipW, ey+ny*tipW);\n      ctx.lineTo(ex-nx*tipW, ey-ny*tipW);\n      ctx.lineTo(hubX-nx*rootW, hubY-ny*rootW);\n      ctx.closePath();ctx.fill();\n      // leading-edge highlight\n      ctx.strokeStyle=rgb(mix(PAL.light,bladeCol,0.4),0.6);\n      ctx.lineWidth=Math.max(0.6,bw*0.18);ctx.lineCap='round';\n      ctx.beginPath();ctx.moveTo(hubX+nx*rootW,hubY+ny*rootW);ctx.lineTo(ex+nx*tipW,ey+ny*tipW);ctx.stroke();\n    }\n    // nacelle: rounded box with top-light / bottom-shadow\n    const nw=tw*2.6*na, nh=tw*1.6*na;\n    const ng=ctx.createLinearGradient(0, topY-nh*0.5, 0, topY+nh*0.5);\n    ng.addColorStop(0, rgb(towerLite));\n    ng.addColorStop(1, rgb(mix(towerDark,PAL.ink,0.3)));\n    ctx.fillStyle=ng;\n    roundRect(t.x-nw*0.42, topY-nh*0.5, nw, nh, nh*0.35);ctx.fill();\n    // hub with a small spherical highlight\n    const hr=bw*1.0;\n    const hg=ctx.createRadialGradient(hubX-hr*0.3,hubY-hr*0.3,hr*0.1,hubX,hubY,hr);\n    hg.addColorStop(0, rgb(mix(PAL.light,towerLite,0.3)));\n    hg.addColorStop(1, rgb(mix(PAL.ink,PAL.seaDeep,0.2)));\n    ctx.fillStyle=hg;\n    ctx.beginPath();ctx.arc(hubX,hubY,hr,0,7);ctx.fill();\n  }\n  ctx.restore();\n}\n\nfunction drawVesselHull(x,y,len,col,alpha){\n  if(alpha<=0.001)return;\n  ctx.save();ctx.globalAlpha*=alpha;\n  const hh=len*0.24;\n  // soft reflection on the water below the hull\n  ctx.save();\n  ctx.globalAlpha*=0.22;\n  ctx.scale(1,-1);\n  ctx.translate(0,-(2*(y+hh)));\n  ctx.fillStyle=rgb(col);\n  ctx.beginPath();\n  ctx.moveTo(x-len*0.5,y);ctx.lineTo(x+len*0.5,y);\n  ctx.lineTo(x+len*0.38,y+hh);ctx.lineTo(x-len*0.42,y+hh);\n  ctx.closePath();ctx.fill();\n  ctx.restore();\n  // hull with vertical shading (deck light, waterline dark)\n  const hg=ctx.createLinearGradient(0,y-hh*0.2,0,y+hh);\n  hg.addColorStop(0, rgb(mix(col,PAL.light,0.35)));\n  hg.addColorStop(0.55, rgb(col));\n  hg.addColorStop(1, rgb(mix(col,PAL.ink,0.45)));\n  ctx.fillStyle=hg;\n  ctx.beginPath();\n  ctx.moveTo(x-len*0.5,y);\n  ctx.lineTo(x+len*0.5,y);\n  ctx.lineTo(x+len*0.38,y+hh);\n  ctx.lineTo(x-len*0.42,y+hh);\n  ctx.closePath();ctx.fill();\n  // deck strip highlight\n  ctx.fillStyle=rgb(mix(col,PAL.light,0.5),0.7);\n  ctx.fillRect(x-len*0.48, y-hh*0.06, len*0.96, hh*0.12);\n  ctx.restore();\n}\n\nfunction roundRect(x,y,w,h,r){\n  ctx.beginPath();\n  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);\n  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();\n}\n\n// LiDAR wind-measurement buoy: floating yellow body + a slim mast + pulse rings\nfunction drawBuoy(x,y,s,alpha,t){\n  if(alpha<=0.001)return;\n  ctx.save();ctx.globalAlpha*=alpha;\n  // reflection\n  ctx.save();ctx.globalAlpha*=0.2;\n  ctx.fillStyle=rgb(mix(PAL.sun,PAL.land,0.3));\n  ctx.fillRect(x-s*0.5,y,s,s*1.2);ctx.restore();\n  // body\n  const bg=ctx.createLinearGradient(x-s,0,x+s,0);\n  bg.addColorStop(0,rgb(mix(PAL.sun,PAL.ink,0.35)));\n  bg.addColorStop(1,rgb(mix(PAL.sun,PAL.land,0.15)));\n  ctx.fillStyle=bg;\n  ctx.beginPath();\n  ctx.moveTo(x-s*0.55,y);ctx.lineTo(x+s*0.55,y);\n  ctx.lineTo(x+s*0.4,y-s*0.9);ctx.lineTo(x-s*0.4,y-s*0.9);ctx.closePath();ctx.fill();\n  // mast\n  ctx.strokeStyle=rgb(PAL.ink);ctx.lineWidth=Math.max(1,s*0.12);\n  ctx.beginPath();ctx.moveTo(x,y-s*0.9);ctx.lineTo(x,y-s*2.0);ctx.stroke();\n  // sensing pulse\n  const pr=((t*0.5)%1);\n  ctx.strokeStyle=rgb(PAL.light,0.4*(1-pr));ctx.lineWidth=Math.max(0.8,s*0.1);\n  ctx.beginPath();ctx.arc(x,y-s*2.0,s*(0.5+pr*1.6),Math.PI*1.15,Math.PI*1.85);ctx.stroke();\n  ctx.restore();\n}\n\n// distant cargo / other sea-user ship, very hazed on the horizon\nfunction drawCloud(cx,cy,s,alpha){\n  if(alpha<=0.001)return;\n  ctx.save();ctx.globalAlpha*=alpha;\n  const lobes=[[-1,0,1],[-0.5,-0.45,0.85],[0.3,-0.35,0.95],[0.9,-0.05,0.8],[1.6,0.05,0.7]];\n  ctx.fillStyle=rgb(mix(PAL.skyLow,PAL.sea,0.28));\n  lobes.forEach(l=>{ctx.beginPath();ctx.ellipse(cx+l[0]*s, cy+l[1]*s+s*0.18, l[2]*s, l[2]*s*0.62, 0,0,7);ctx.fill();});\n  const g2=ctx.createLinearGradient(0,cy-s,0,cy+s);\n  g2.addColorStop(0,rgb(mix(PAL.light,PAL.sun,0.4)));\n  g2.addColorStop(1,rgb(mix(PAL.skyLow,PAL.light,0.5)));\n  ctx.fillStyle=g2;\n  lobes.forEach(l=>{ctx.beginPath();ctx.ellipse(cx+l[0]*s, cy+l[1]*s, l[2]*s, l[2]*s*0.66, 0,0,7);ctx.fill();});\n  ctx.restore();\n}\nfunction drawBird(x,y,s,flap,alpha){\n  if(alpha<=0.001)return;\n  ctx.save();ctx.globalAlpha*=alpha;\n  ctx.strokeStyle=rgb(mix(PAL.ink,PAL.seaDeep,0.2));\n  ctx.lineWidth=Math.max(1,s*0.14);ctx.lineCap='round';ctx.lineJoin='round';\n  const up=Math.sin(flap)*0.5+0.5;\n  const dy=-s*0.5*up;\n  ctx.beginPath();\n  ctx.moveTo(x-s, y+dy);\n  ctx.quadraticCurveTo(x-s*0.3, y-s*0.15, x, y);\n  ctx.quadraticCurveTo(x+s*0.3, y-s*0.15, x+s, y+dy);\n  ctx.stroke();\n  ctx.restore();\n}\nfunction drawDistantShip(x,y,s,alpha){\n  if(alpha<=0.001)return;\n  ctx.save();ctx.globalAlpha*=alpha;\n  const col=mix(mix(PAL.ink,PAL.seaDeep,0.4),PAL.skyLow,0.55);\n  ctx.fillStyle=rgb(col);\n  ctx.fillRect(x-s*0.5,y-s*0.16,s,s*0.16);           // hull\n  ctx.fillRect(x-s*0.28,y-s*0.42,s*0.5,s*0.26);      // superstructure block\n  // containers\n  ctx.fillStyle=rgb(mix(col,PAL.green,0.15));\n  ctx.fillRect(x-s*0.46,y-s*0.30,s*0.16,s*0.14);\n  ctx.restore();\n}\n\n// onshore lattice grid pylon (transmission tower silhouette)\nfunction drawPylon(x,baseY,ph,alpha){\n  if(alpha<=0.001)return;\n  ctx.save();ctx.globalAlpha*=alpha;\n  const col=mix(PAL.ink,PAL.land,0.15);\n  ctx.strokeStyle=rgb(col);ctx.lineWidth=Math.max(1,ph*0.03);ctx.lineCap='round';\n  const topW=ph*0.10, botW=ph*0.34, topY=baseY-ph;\n  // legs\n  ctx.beginPath();\n  ctx.moveTo(x-botW,baseY);ctx.lineTo(x-topW,topY);\n  ctx.moveTo(x+botW,baseY);ctx.lineTo(x+topW,topY);\n  // cross braces\n  for(let i=1;i<4;i++){\n    const yy=lerp(baseY,topY,i/4), ww=lerp(botW,topW,i/4);\n    ctx.moveTo(x-ww,yy);ctx.lineTo(x+ww,yy);\n  }\n  // cross-arms\n  ctx.moveTo(x-ph*0.24,topY+ph*0.06);ctx.lineTo(x+ph*0.24,topY+ph*0.06);\n  ctx.moveTo(x-ph*0.18,topY+ph*0.16);ctx.lineTo(x+ph*0.18,topY+ph*0.16);\n  ctx.stroke();\n  ctx.restore();\n}\n\n/* ---------------------------------------------------------------\n   MAIN RENDER\n--------------------------------------------------------------- */\nlet tPrev=0, tSec=0;\nwindow.__renderErr='none';\nfunction safeRender(ts){ try{ render(ts); }catch(e){ window.__renderErr=(e&&(e.stack||e.message))||String(e); } }\nfunction render(ts){\n  if(!tPrev)tPrev=ts;\n  let dt=(ts-tPrev)/1000; tPrev=ts;\n  if(dt>0.1)dt=0.1;\n  tSec+=dt;\n\n  // self-healing sizing: re-measure if unset or the container changed width\n  const cw=canvas.parentElement.clientWidth;\n  if(cw>0 && cw!==CSSW){ resize(); updateThumb(); }\n\n  const g=geo();\n\n  // ---- camera easing ----\n  const tgt=camTargetFor(year);\n  if(!cam.ready){cam.fx=tgt.fx;cam.lz=Math.log(tgt.z);cam.ready=true;}\n  const k=3.2;\n  const e=1-Math.exp(-dt*k);\n  cam.fx += (tgt.fx-cam.fx)*e;\n  cam.lz += (Math.log(tgt.z)-cam.lz)*e;\n  curZoom=Math.exp(cam.lz);\n  curFocusX=g.w*cam.fx;\n  curFocusY=g.h*0.55;\n  const H=1/curZoom;   // hairline\n\n  // ---- stage progresses ----\n  const conProg=clamp((year-10)/(13-10),0,1);\n  const decProg=clamp((year-38)/(40-38),0,1);\n  const sDev=strength(STAGES[0],year), sCon=strength(STAGES[1],year),\n        sOm=strength(STAGES[2],year), sDec=strength(STAGES[3],year);\n  // O&M-only elements (crew transfer vessel, operations base) clear as decommissioning begins\n  const omLive=sOm*(year<13?Math.max(0,1-(13-year)/0.8):1)*(year<38?1:Math.max(0,1-(year-38)/0.8));\n  // Development survey elements clear as construction begins\n  const devLive=year<=10?sDev:Math.max(0,sDev*(1-(year-10)/0.8));\n\n  // build progress per turbine\n  const p=[];\n  for(let i=0;i<NT;i++){\n    let pi;\n    if(year<10) pi=0;\n    else if(year<13) pi=clamp(conProg*NT - i,0,1);          // nearest first\n    else if(year<38) pi=1;\n    else pi=clamp(1-(decProg*NT - i),0,1);                  // nearest removed first\n    p.push(pi);\n  }\n\n  // ================= DEVICE-SPACE clear =================\n  ctx.setTransform(DPR,0,0,DPR,0,0);\n  ctx.clearRect(0,0,g.w,g.h);\n\n  // ---- sky ----\n  let sky=ctx.createLinearGradient(0,0,0,g.horizon);\n  sky.addColorStop(0,rgb(PAL.skyTop));\n  sky.addColorStop(1,rgb(PAL.skyLow));\n  ctx.fillStyle=sky;ctx.fillRect(0,0,g.w,g.horizon+2);\n\n  // ---- passing clouds & birds (screen space, drift across the whole 40 years) ----\n  // clouds: two lanes on long loops; each fades in/out within its loop so it can vanish mid-scene\n  (function(){\n    const lanes=[\n      {y:g.h*0.15, s:g.h*0.05, dur:46, speed:1.0, off:0.0},\n      {y:g.h*0.27, s:g.h*0.035, dur:63, speed:0.7, off:0.45},\n      {y:g.h*0.09, s:g.h*0.028, dur:80, speed:1.3, off:0.72},\n    ];\n    lanes.forEach(L=>{\n      const ph=((tSec*AMB)/L.dur + L.off)%1;\n      const x=lerp(-g.w*0.2, g.w*1.2, ph);\n      // fade envelope: invisible at the ends, present in the middle third-ish, dips out mid-way\n      const env=Math.max(0, Math.sin(ph*Math.PI)) * (0.55+0.45*Math.sin(ph*Math.PI*3+L.off*6));\n      drawCloud(x, L.y, L.s, clamp(env,0,1)*0.9);\n    });\n  })();\n  // birds: an occasional small skein crossing, only now and then\n  (function(){\n    const period=34, ph=((tSec*AMB)/period)%1;\n    const vis=Math.max(0, Math.sin(ph*Math.PI));   // present for part of each period\n    if(vis>0.05){\n      const x=lerp(g.w*1.1, -g.w*0.1, ph);\n      const y=g.h*0.20 + Math.sin(ph*6)*g.h*0.015;\n      const bs=g.h*0.014;\n      const flap=tSec*6*AMB;\n      drawBird(x, y, bs, flap, vis);\n      drawBird(x+bs*3.2, y+bs*1.4, bs*0.85, flap+0.7, vis);\n      drawBird(x-bs*3.0, y+bs*1.2, bs*0.85, flap+1.1, vis);\n      drawBird(x+bs*6.0, y+bs*2.6, bs*0.7, flap+1.6, vis*0.9);\n    }\n  })();\n\n  // ---- APPLY CAMERA for world drawing ----\n  ctx.save();\n  ctx.translate(g.w/2,g.h/2);\n  ctx.scale(curZoom,curZoom);\n  ctx.translate(-curFocusX,-curFocusY);\n\n  // sun glow (soft, low)\n  const sg=ctx.createRadialGradient(g.sunX,g.sunY,0,g.sunX,g.sunY,g.h*0.5);\n  sg.addColorStop(0,rgb(PAL.sun,0.55));\n  sg.addColorStop(1,rgb(PAL.sun,0));\n  ctx.fillStyle=sg;ctx.fillRect(-g.w,-g.h,g.w*3,g.h*2);\n\n  // haze band at horizon\n  const hz=ctx.createLinearGradient(0,g.horizon-g.h*0.10,0,g.horizon+g.h*0.04);\n  hz.addColorStop(0,rgb(PAL.light,0));\n  hz.addColorStop(0.6,rgb(PAL.light,0.55));\n  hz.addColorStop(1,rgb(PAL.light,0));\n  ctx.fillStyle=hz;ctx.fillRect(-g.w,g.horizon-g.h*0.10,g.w*3,g.h*0.14);\n\n  // ---- sea ----\n  let sea=ctx.createLinearGradient(0,g.horizon,0,g.h);\n  sea.addColorStop(0,rgb(PAL.seaFar));\n  sea.addColorStop(0.35,rgb(PAL.sea));\n  sea.addColorStop(1,rgb(PAL.seaDeep));\n  ctx.fillStyle=sea;ctx.fillRect(-g.w,g.horizon,g.w*3,g.h-g.horizon+2);\n  // vertical reflections under each built turbine\n  ctx.save();\n  for(let i=0;i<NT;i++){\n    if(p[i]<0.4) continue;\n    const t=g.turb[i];\n    const rl=t.towerH*0.55*smooth(0.4,0.9,p[i]);\n    const rg=ctx.createLinearGradient(0,t.baseY,0,t.baseY+rl);\n    rg.addColorStop(0,rgb(PAL.ink,0.22*(1-t.d*0.4)));\n    rg.addColorStop(1,rgb(PAL.ink,0));\n    ctx.fillStyle=rg;\n    const wob=Math.sin(tSec*0.6*AMB+i)*1.2*H;\n    ctx.fillRect(t.x-Math.max(1,t.towerH*0.05)+wob, t.baseY, Math.max(1.6,t.towerH*0.08), rl);\n  }\n  ctx.restore();\n  // gentle shimmer lines (single subtle ambient on the water)\n  ctx.strokeStyle=rgb(PAL.light,0.10);\n  ctx.lineWidth=1.2*H;\n  for(let i=0;i<5;i++){\n    const yy=lerp(g.horizon+g.h*0.05,g.h*0.95,i/4);\n    const ph=Math.sin(tSec*0.35*AMB + i*1.7)*g.w*0.01;\n    ctx.beginPath();\n    ctx.moveTo(-g.w, yy);\n    ctx.lineTo(g.w*2, yy+ph);\n    ctx.stroke();\n  }\n\n  // ---- export + array cable route (dashed, animated dash offset) ----\n  // faint always; brightens during construction & O&M (power flowing)\n  const cableAlpha=0.18 + 0.5*Math.max(sCon,sOm*0.7) + 0.3*sDec*decProg;\n  ctx.save();\n  ctx.globalAlpha=clamp(cableAlpha,0,0.85);\n  ctx.strokeStyle=rgb(mix(PAL.ink,PAL.green,0.35));\n  ctx.lineWidth=1.6*H;\n  ctx.setLineDash([7*H,7*H]);\n  ctx.lineDashOffset=-(tSec*14*AMB)%1000;\n  ctx.beginPath();\n  ctx.moveTo(g.landfallX, g.shoreY-g.h*0.02);\n  ctx.lineTo(g.sub.x, g.sub.baseY+g.h*0.03);\n  // along the array\n  for(let i=0;i<NT;i++){ if(p[i]>0.1) ctx.lineTo(g.turb[i].x, g.turb[i].baseY+g.h*0.02); }\n  ctx.stroke();\n  ctx.setLineDash([]);\n  ctx.restore();\n\n  // ---- offshore substation (built during construction, lifted away during decommissioning) ----\n  const subRemove=year<38?1:clamp(1-(decProg-0.15)/0.5,0,1);\n  const subP=clamp((conProg*NT-0.5),0,1)*(year>=10?1:0)*subRemove;\n  const subAlpha=(year>=10)?clamp((0.25+Math.max(sCon,sOm))*subRemove,0,1):0;\n  if(subAlpha>0.01 && subP>0.05){\n    ctx.save();ctx.globalAlpha*=subAlpha;\n    const s=g.sub, u=g.h*0.05*s.sc*subP;\n    // reflection\n    ctx.save();ctx.globalAlpha*=0.2;\n    ctx.fillStyle=rgb(mix(PAL.ink,PAL.seaDeep,0.2));\n    ctx.fillRect(s.x-u*0.75, s.baseY, u*1.5, u*0.7);\n    ctx.restore();\n    // legs\n    ctx.lineWidth=2*H;ctx.strokeStyle=rgb(mix(PAL.ink,PAL.seaDeep,0.2));\n    ctx.beginPath();\n    ctx.moveTo(s.x-u*0.7,s.baseY);ctx.lineTo(s.x-u*0.5,s.baseY-u);\n    ctx.moveTo(s.x+u*0.7,s.baseY);ctx.lineTo(s.x+u*0.5,s.baseY-u);\n    ctx.stroke();\n    // deck (shaded top-to-bottom)\n    const dg=ctx.createLinearGradient(0,s.baseY-u*1.35,0,s.baseY-u*0.8);\n    dg.addColorStop(0,rgb(mix(PAL.light,PAL.seaFar,0.4)));\n    dg.addColorStop(1,rgb(mix(PAL.ink,PAL.seaDeep,0.2)));\n    ctx.fillStyle=dg;\n    ctx.fillRect(s.x-u*0.75, s.baseY-u*1.35, u*1.5, u*0.55);\n    // top block (light left face, dark right)\n    const bg=ctx.createLinearGradient(s.x-u*0.45,0,s.x+u*0.45,0);\n    bg.addColorStop(0,rgb(mix(PAL.green,PAL.light,0.35)));\n    bg.addColorStop(1,rgb(mix(PAL.ink,PAL.green,0.25)));\n    ctx.fillStyle=bg;\n    ctx.fillRect(s.x-u*0.45, s.baseY-u*1.75, u*0.9, u*0.5);\n    ctx.restore();\n  }\n\n  // ---- turbines (far to near so near overlaps) ----\n  const baseAngle=tSec*0.55*AMB;\n  for(let i=NT-1;i>=0;i--){\n    const t=g.turb[i];\n    // near-full alpha; slightly veil distant ones\n    const distVeil=lerp(1,0.82,t.d);\n    fillTurbine(g,t,p[i], baseAngle + i*0.5, distVeil, H);\n  }\n  // ---- bare monopile stubs left where turbines have been removed (decommissioning) ----\n  if(sDec>0.02){\n    for(let i=0;i<NT;i++){\n      const removed=(decProg*NT - i);   // >1 once this turbine is gone\n      if(removed>0.6 && p[i]<0.35){\n        const t=g.turb[i];\n        const stubH=t.towerH*0.13, tw=Math.max(1.2,t.towerH*0.05);\n        ctx.save();ctx.globalAlpha*=sDec*lerp(1,0.82,t.d);\n        const sg2=ctx.createLinearGradient(t.x-tw,0,t.x+tw,0);\n        sg2.addColorStop(0,rgb(mix(PAL.ink,PAL.seaDeep,0.2)));\n        sg2.addColorStop(1,rgb(mix(PAL.light,PAL.seaFar,0.4)));\n        ctx.fillStyle=sg2;\n        ctx.fillRect(t.x-tw*0.7, t.baseY-stubH, tw*1.4, stubH);\n        ctx.fillStyle=rgb(PAL.ink,0.28);\n        ctx.fillRect(t.x-tw*0.7, t.baseY-stubH*0.22, tw*1.4, stubH*0.22);\n        ctx.restore();\n      }\n    }\n  }\n\n  // ---- working vessels per stage ----\n  // Development: survey vessel with sonar fan to seabed\n  let devVx=0, devVy=0;\n  if(devLive>0.02){\n    const vx=lerp(g.w*0.44,g.w*0.6, 0.5+0.5*Math.sin(tSec*0.15*AMB));\n    const vy=g.vesselY;\n    devVx=vx; devVy=vy;\n    ctx.save();ctx.globalAlpha*=devLive;\n    // sonar fan\n    ctx.fillStyle=rgb(PAL.light,0.16);\n    ctx.beginPath();\n    ctx.moveTo(vx,vy+g.h*0.01);\n    ctx.lineTo(vx-g.w*0.03, g.h*0.99);\n    ctx.lineTo(vx+g.w*0.03, g.h*0.99);\n    ctx.closePath();ctx.fill();\n    ctx.restore();\n    drawVesselHull(vx,vy,g.w*0.05,mix(PAL.ink,PAL.seaDeep,0.15),devLive);\n    // LiDAR wind-measurement buoys\n    drawBuoy(g.w*0.66, g.horizon+g.h*0.10, g.h*0.022, devLive, tSec*AMB);\n    drawBuoy(g.w*0.83, g.horizon+g.h*0.055, g.h*0.017, devLive*0.9, tSec*AMB+1.3);\n    // an occasional other sea-user on the horizon\n    drawDistantShip(g.w*0.90, g.horizon-g.h*0.002, g.h*0.06, devLive*0.8);\n  }\n  // Construction: jack-up / installation vessel by the nearest building turbine\n  if(sCon>0.02){\n    const near=g.turb[Math.min(NT-1, Math.floor(conProg*NT))]||g.turb[0];\n    const vx=near.x - g.w*0.05, vy=g.vesselY*0.96;\n    ctx.save();ctx.globalAlpha*=sCon;\n    ctx.strokeStyle=rgb(PAL.ink);ctx.lineWidth=2*H;ctx.lineCap='round';\n    // four jack-up legs (lattice) standing on the seabed\n    const legXs=[vx-g.w*0.03, vx-g.w*0.008, vx+g.w*0.014, vx+g.w*0.036];\n    legXs.forEach(lx=>{\n      ctx.beginPath();ctx.moveTo(lx,vy);ctx.lineTo(lx,g.h*0.94);ctx.stroke();\n      // lattice cross-ticks\n      ctx.lineWidth=1*H;\n      for(let k=0;k<4;k++){const yy=lerp(vy,g.h*0.94,k/4);ctx.beginPath();ctx.moveTo(lx-g.w*0.004,yy);ctx.lineTo(lx+g.w*0.004,yy+g.h*0.02);ctx.stroke();}\n      ctx.lineWidth=2*H;\n    });\n    ctx.restore();\n    drawVesselHull(vx,vy,g.w*0.08,mix(PAL.ink,PAL.seaDeep,0.1),sCon);\n    ctx.save();ctx.globalAlpha*=sCon;\n    ctx.strokeStyle=rgb(PAL.ink);ctx.lineWidth=2.4*H;ctx.lineCap='round';\n    // lattice tower crane on deck\n    const cbx=vx+g.w*0.022, cty=vy-g.h*0.02, ctop=vy-g.h*0.20;\n    ctx.beginPath();\n    ctx.moveTo(cbx-g.w*0.006,cty);ctx.lineTo(cbx-g.w*0.002,ctop);\n    ctx.moveTo(cbx+g.w*0.006,cty);ctx.lineTo(cbx+g.w*0.002,ctop);\n    ctx.stroke();\n    ctx.lineWidth=1*H;\n    for(let k=0;k<5;k++){const yy=lerp(cty,ctop,k/5);ctx.beginPath();ctx.moveTo(cbx-g.w*0.005,yy);ctx.lineTo(cbx+g.w*0.005,yy+g.h*0.02);ctx.stroke();}\n    // boom + hoist line to the turbine top\n    ctx.lineWidth=2.4*H;\n    ctx.beginPath();\n    ctx.moveTo(cbx,ctop);\n    ctx.lineTo(near.x, near.baseY-near.towerH*0.55);\n    ctx.stroke();\n    ctx.lineWidth=1.2*H;\n    ctx.beginPath();ctx.moveTo(near.x,near.baseY-near.towerH*0.55);ctx.lineTo(near.x,near.baseY-near.towerH*0.4);ctx.stroke();\n    ctx.restore();\n  }\n  // O&M: crew transfer vessel — slow day loop out and back\n  let omVx=0, omVy=0;\n  if(omLive>0.02){\n    const day=(tSec*0.05*AMB)%1;                 // 0..1 across a \"day\"\n    const out=Math.sin(day*Math.PI);             // 0 -> 1 -> 0 (leave & return)\n    const vx=lerp(g.landfallX+g.w*0.06, g.turb[2].x, out);\n    const vy=lerp(g.shoreY-g.h*0.03, g.vesselY, 0.4+0.4*out);\n    omVx=vx; omVy=vy;\n    // wake\n    ctx.save();ctx.globalAlpha*=omLive*0.5;\n    ctx.strokeStyle=rgb(PAL.light,0.5);ctx.lineWidth=1.4*H;\n    ctx.beginPath();ctx.moveTo(vx-g.w*0.04,vy+g.h*0.012);ctx.lineTo(vx,vy+g.h*0.012);ctx.stroke();\n    ctx.restore();\n    drawVesselHull(vx,vy,g.w*0.045,mix(PAL.ink,PAL.green,0.18),omLive);\n  }\n  // Decommissioning: heavy lift vessel lowering a blade\n  if(sDec>0.02){\n    const idx=clamp(Math.floor(decProg*NT),0,NT-1);\n    const near=g.turb[idx]||g.turb[0];\n    const vx=near.x - g.w*0.055, vy=g.vesselY*0.96;\n    drawVesselHull(vx,vy,g.w*0.075,mix(PAL.ink,PAL.seaDeep,0.1),sDec);\n    ctx.save();ctx.globalAlpha*=sDec;\n    ctx.strokeStyle=rgb(PAL.ink);ctx.lineWidth=2*H;ctx.lineCap='round';\n    ctx.beginPath();\n    ctx.moveTo(vx,vy);ctx.lineTo(vx+g.w*0.02, vy-g.h*0.14);\n    const drop=lerp(near.baseY-near.towerH*0.4, vy-g.h*0.02, (decProg*NT)%1);\n    ctx.lineTo(vx+g.w*0.02, drop);\n    ctx.stroke();\n    ctx.restore();\n  }\n\n  // ---- shore foreground (the ground we stand on) ----\n  ctx.save();\n  // water veil at the shoreline\n  const land=ctx.createLinearGradient(0,g.shoreY-g.h*0.06,0,g.h);\n  land.addColorStop(0,rgb(PAL.land,0));\n  land.addColorStop(0.5,rgb(PAL.land,1));\n  land.addColorStop(1,rgb(mix(PAL.land,PAL.ink,0.3),1));\n  ctx.fillStyle=land;\n  ctx.beginPath();\n  ctx.moveTo(-g.w,g.h);\n  ctx.lineTo(-g.w,g.shoreY);\n  // gentle undulating shore\n  ctx.quadraticCurveTo(g.w*0.25,g.shoreY-g.h*0.02, g.w*0.5,g.shoreY-g.h*0.004);\n  ctx.quadraticCurveTo(g.w*0.8,g.shoreY+g.h*0.01, g.w*2,g.shoreY-g.h*0.006);\n  ctx.lineTo(g.w*2,g.h);ctx.closePath();ctx.fill();\n\n  // shore structures per stage (built simply as blocks)\n  const sxPort=g.w*0.16;\n  // Development: onshore grid infrastructure (pylons) — \"investigating grid connection\"\n  if(devLive>0.02){\n    drawPylon(g.w*0.05, g.shoreY-g.h*0.012, g.h*0.14, devLive*0.85);\n    drawPylon(g.w*0.115, g.shoreY-g.h*0.006, g.h*0.10, devLive*0.7);\n    // catenary line between them\n    ctx.save();ctx.globalAlpha*=devLive*0.55;\n    ctx.strokeStyle=rgb(mix(PAL.ink,PAL.land,0.15));ctx.lineWidth=1*H;\n    ctx.beginPath();\n    ctx.moveTo(g.w*0.05,g.shoreY-g.h*0.145);\n    ctx.quadraticCurveTo(g.w*0.082,g.shoreY-g.h*0.09,g.w*0.115,g.shoreY-g.h*0.10);\n    ctx.stroke();ctx.restore();\n  }\n  // Construction: port stockpiles of monopiles / transition pieces\n  if(sCon>0.02){\n    ctx.save();ctx.globalAlpha*=sCon;\n    for(let c=0;c<4;c++){\n      const px=g.w*0.055+c*g.w*0.022, py=g.shoreY-g.h*0.01;\n      const ph=g.h*0.035, pw=g.w*0.016;\n      const pg=ctx.createLinearGradient(px,0,px+pw,0);\n      pg.addColorStop(0,rgb(mix(PAL.land,PAL.ink,0.3)));\n      pg.addColorStop(1,rgb(mix(PAL.sun,PAL.land,0.25)));\n      ctx.fillStyle=pg;\n      ctx.fillRect(px,py-ph,pw,ph);\n      // rim (tube end)\n      ctx.fillStyle=rgb(mix(PAL.ink,PAL.land,0.4));\n      ctx.fillRect(px,py-ph,pw,ph*0.12);\n    }\n    ctx.restore();\n  }\n  // Construction / Decommissioning: port cranes + heavy transport\n  const portA=Math.max(sCon,sDec);\n  if(portA>0.02){\n    ctx.save();ctx.globalAlpha*=portA;\n    ctx.strokeStyle=rgb(PAL.ink);ctx.fillStyle=rgb(PAL.ink);ctx.lineWidth=2*H;\n    for(let c=0;c<2;c++){\n      const cx=sxPort+c*g.w*0.06, cy=g.shoreY-g.h*0.006;\n      ctx.beginPath();\n      ctx.moveTo(cx,cy);ctx.lineTo(cx,cy-g.h*0.11);\n      ctx.lineTo(cx+g.w*0.05,cy-g.h*0.09);\n      ctx.stroke();\n    }\n    ctx.restore();\n  }\n  // O&M: operations base building\n  if(omLive>0.02){\n    ctx.save();ctx.globalAlpha*=omLive;\n    const bx=sxPort, by=g.shoreY-g.h*0.006;\n    const bw=g.w*0.075, bh=g.h*0.05, roofH=g.h*0.012;\n    // cast shadow on the ground\n    ctx.fillStyle=rgb(PAL.ink,0.18);\n    ctx.beginPath();\n    ctx.moveTo(bx+bw*0.1,by);ctx.lineTo(bx+bw+bw*0.12,by);\n    ctx.lineTo(bx+bw+bw*0.02,by+bh*0.14);ctx.lineTo(bx+bw*0.02,by+bh*0.14);\n    ctx.closePath();ctx.fill();\n    // front wall (light on left, shaded toward right)\n    const wg=ctx.createLinearGradient(bx,0,bx+bw,0);\n    wg.addColorStop(0,rgb(mix(PAL.light,PAL.land,0.35)));\n    wg.addColorStop(1,rgb(mix(PAL.ink,PAL.land,0.28)));\n    ctx.fillStyle=wg;\n    ctx.fillRect(bx, by-bh, bw, bh);\n    // right gable end (darker side plane for depth)\n    ctx.fillStyle=rgb(mix(PAL.ink,PAL.land,0.15));\n    ctx.beginPath();\n    ctx.moveTo(bx+bw,by-bh);ctx.lineTo(bx+bw+bw*0.14,by-bh+bh*0.08);\n    ctx.lineTo(bx+bw+bw*0.14,by);ctx.lineTo(bx+bw,by);ctx.closePath();ctx.fill();\n    // roof (bright top plane)\n    const rg=ctx.createLinearGradient(0,by-bh-roofH,0,by-bh);\n    rg.addColorStop(0,rgb(mix(PAL.light,PAL.seaFar,0.3)));\n    rg.addColorStop(1,rgb(mix(PAL.light,PAL.land,0.2)));\n    ctx.fillStyle=rg;\n    ctx.beginPath();\n    ctx.moveTo(bx,by-bh);ctx.lineTo(bx+bw,by-bh);\n    ctx.lineTo(bx+bw+bw*0.14,by-bh+bh*0.08);ctx.lineTo(bx+bw*0.14,by-bh+bh*0.08);\n    ctx.closePath();ctx.fill();\n    // roof front edge\n    ctx.fillStyle=rgb(mix(PAL.ink,PAL.land,0.35));\n    ctx.fillRect(bx,by-bh-roofH*0.15,bw,roofH*0.28);\n    // roller doors (recessed, shaded)\n    const dg2=ctx.createLinearGradient(0,by-bh*0.6,0,by);\n    dg2.addColorStop(0,rgb(mix(PAL.ink,PAL.seaDeep,0.15)));\n    dg2.addColorStop(1,rgb(mix(PAL.ink,PAL.land,0.05)));\n    ctx.fillStyle=dg2;\n    ctx.fillRect(bx+bw*0.10, by-bh*0.6, bw*0.22, bh*0.6);\n    ctx.fillRect(bx+bw*0.42, by-bh*0.6, bw*0.22, bh*0.6);\n    // glazed control-room strip (green, with a highlight)\n    ctx.fillStyle=rgb(mix(PAL.green,PAL.ink,0.25));\n    ctx.fillRect(bx+bw*0.72, by-bh*0.7, bw*0.2, bh*0.45);\n    ctx.fillStyle=rgb(mix(PAL.light,PAL.green,0.4),0.6);\n    ctx.fillRect(bx+bw*0.72, by-bh*0.7, bw*0.2, bh*0.09);\n    ctx.restore();\n  }\n  ctx.restore();\n\n  ctx.restore();  // end camera transform\n\n  // ---- focus scrim (subtle, deepens the focused stage) ----\n  const focusStrength=Math.max(sDev,sCon,sOm,sDec);\n  ctx.fillStyle=rgb(PAL.ink, 0.05*focusStrength);\n  ctx.fillRect(0,0,g.w,g.h);\n\n  // ================= LABELS (screen space) =================\n  const labels=[];\n  function addLabel(wx,wy,text,alpha,side,sub){\n    if(alpha<=0.04)return;\n    const [sx,sy]=worldToScreen(wx,wy);\n    labels.push({sx,sy,text,alpha,side:side||1,sub:sub||null});\n  }\n  if(devLive>0.05){\n    addLabel(devVx,devVy+g.h*0.01,\"Survey vessel\",devLive,-1);\n    addLabel(devVx,g.h*0.83,\"Seabed survey\",devLive*0.9,1);\n  }\n  if(sCon>0.05){\n    addLabel(g.turb[Math.min(NT-1,Math.floor(conProg*NT))].x, g.turb[0].baseY-g.turb[0].towerH*0.4,\"Turbines installed\",sCon,1);\n    if(subP>0.35) addLabel(g.sub.x,g.sub.baseY-g.h*0.06,\"Offshore substation\",sCon*smooth(0.35,0.6,subP),-1);\n  }\n  // export cable — present from construction onward; stays buried after everything else is removed\n  {\n    const cableVis=Math.max(sCon,sOm,sDec);\n    if(cableVis>0.05) addLabel((g.landfallX+g.sub.x)/2,(g.shoreY+g.sub.baseY)/2+g.h*0.02,\"Export cable\",cableVis,1,sDec>0.05?\"Commonly left buried in place\":null);\n  }\n  if(sOm>0.05){\n    addLabel(g.turb[3].x,g.turb[3].baseY-g.turb[3].towerH*0.7,\"Turbines turning\",sOm*p[3],1);\n    addLabel(omVx,omVy+g.h*0.012,\"Crew transfer vessel\",omLive,-1);\n    addLabel(g.w*0.20,g.shoreY-g.h*0.072,\"Operations base\",omLive,1);\n  }\n  if(sDec>0.05){\n    const idx=clamp(Math.floor(decProg*NT),0,NT-1);\n    addLabel(g.turb[idx].x-g.w*0.055,g.vesselY-g.h*0.05,\"Heavy lift vessel\",sDec*(1-smooth(0.82,1,decProg)),-1);\n  }\n  // simple vertical de-collision\n  labels.sort((a,b)=>a.sy-b.sy);\n  for(let i=1;i<labels.length;i++){\n    if(labels[i].sy-labels[i-1].sy<26) labels[i].sy=labels[i-1].sy+26;\n  }\n  for(const L of labels){\n    const hasSub=!!L.sub;\n    const subFont='400 11px -apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif';\n    const mainFont='600 13px -apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif';\n    ctx.font=mainFont;\n    const tw=ctx.measureText(L.text).width;\n    let sw=0;\n    if(hasSub){ ctx.font=subFont; sw=ctx.measureText(L.sub).width; }\n    const padX=9, ph=hasSub?38:24, pw=Math.max(tw,sw)+padX*2;\n    let px=L.sx + L.side*30;\n    if(L.side<0) px=L.sx-30-pw;\n    let py=L.sy;\n    px=clamp(px,6,g.w-pw-6); py=clamp(py,ph/2+4,g.h-ph/2-4);\n    // leader line\n    ctx.globalAlpha=L.alpha;\n    ctx.strokeStyle=rgb(PAL.ink,0.55);\n    ctx.lineWidth=1;\n    ctx.beginPath();ctx.moveTo(L.sx,L.sy);ctx.lineTo(L.side<0?px+pw:px, py);ctx.stroke();\n    ctx.beginPath();ctx.arc(L.sx,L.sy,2.2,0,7);ctx.fillStyle=rgb(PAL.ink,0.7);ctx.fill();\n    // pill\n    ctx.fillStyle=rgb(hx('#0f1c18'));\n    roundRect(px,py-ph/2,pw,ph,6);ctx.fill();\n    ctx.textBaseline='middle';\n    if(hasSub){\n      ctx.font=mainFont;ctx.fillStyle=rgb(hx('#eff4f0'));\n      ctx.fillText(L.text,px+padX,py-ph/2+11);\n      ctx.font=subFont;ctx.fillStyle=rgb(hx('#9db8a8'));\n      ctx.fillText(L.sub,px+padX,py-ph/2+27);\n    }else{\n      ctx.font=mainFont;ctx.fillStyle=rgb(hx('#eff4f0'));\n      ctx.fillText(L.text,px+padX,py+0.5);\n    }\n    ctx.globalAlpha=1;\n  }\n\n  requestAnimationFrame(safeRender);\n}\n\n/* ---------------------------------------------------------------\n   UI — timeline, slider, panel, a11y\n--------------------------------------------------------------- */\nconst TOTAL=40;\nconst input=document.getElementById('year');\nconst thumb=document.getElementById('thumb');\nconst segbar=document.getElementById('segbar');\nconst ticks=document.getElementById('ticks');\nconst badgeYear=document.getElementById('badgeYear');\nconst badgeStage=document.getElementById('badgeStage');\nconst rangeHint=document.getElementById('rangeHint');\nconst pName=document.getElementById('pName');\nconst pDur=document.getElementById('pDur');\nconst fieldsEl=document.getElementById('fields');\nconst live=document.getElementById('live');\nconst prevBtn=document.getElementById('prevBtn');\nconst nextBtn=document.getElementById('nextBtn');\n\n// build the proportional segmented timeline\nSTAGES.forEach((s,i)=>{\n  const seg=document.createElement('div');\n  seg.className='seg';\n  seg.style.flex=(s.end-s.start)+' 0 0';\n  seg.style.background=SEG_COLORS[i];\n  seg.dataset.i=i;\n  seg.addEventListener('click',()=>{ setYear(s.center,true); });\n  segbar.appendChild(seg);\n});\n// boundary ticks\n[10,13,38].forEach(y=>{\n  const t=document.createElement('div');\n  t.className='tick';t.style.left=(y/TOTAL*100)+'%';\n  ticks.appendChild(t);\n});\n// year marks below the bar\nconst yearmarks=document.getElementById('yearmarks');\n[[0,'1'],[10,'10'],[13,'13'],[38,'38'],[40,'40']].forEach(([y,lab])=>{\n  const m=document.createElement('span');\n  m.className='yearmark';m.style.left=(y/TOTAL*100)+'%';m.textContent=lab;\n  yearmarks.appendChild(m);\n});\n\nfunction stageIndexFor(y){\n  for(let i=STAGES.length-1;i>=0;i--){ if(y>=STAGES[i].start) return i; }\n  return 0;\n}\nlet curStage=-1;\nfunction renderPanel(idx){\n  const s=STAGES[idx];\n  fieldsEl.classList.add('fade');\n  setTimeout(()=>{\n    pName.textContent=s.name;\n    pDur.textContent=s.chip;\n    fieldsEl.innerHTML='';\n    s.fields.forEach((f,fi)=>{\n      const open=(fi===0);\n      const acc=document.createElement('div');\n      acc.className='acc'+(open?' open':'');\n      const bid='acc-b-'+idx+'-'+fi;\n      acc.innerHTML=`<button class=\"acc-head\" type=\"button\" aria-expanded=\"${open}\" aria-controls=\"${bid}\">`+\n        `<span class=\"flabel\">${f[0]}<\u002Fspan>`+\n        `<svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\u002Fsvg>`+\n        `<\u002Fbutton>`+\n        `<div class=\"acc-body\" id=\"${bid}\"><div><p class=\"fval\">${f[1]}<\u002Fp><\u002Fdiv><\u002Fdiv>`;\n      const btn=acc.querySelector('.acc-head');\n      btn.addEventListener('click',()=>{\n        const nowOpen=!acc.classList.contains('open');\n        acc.classList.toggle('open',nowOpen);\n        btn.setAttribute('aria-expanded',nowOpen);\n      });\n      fieldsEl.appendChild(acc);\n    });\n    fieldsEl.classList.remove('fade');\n  },140);\n  // active seg outline\n  segbar.querySelectorAll('.seg').forEach((el,i)=>el.classList.toggle('active',i===idx));\n  live.textContent=`${s.name}. ${s.live}`;\n}\n\nfunction updateThumb(){\n  const pct=year/TOTAL;\n  thumb.style.left=`calc(${pct*100}% )`;\n}\nfunction updateReadouts(){\n  const idx=stageIndexFor(year);\n  const s=STAGES[idx];\n  const yShown=Math.round(year);\n  badgeYear.textContent='Year '+yShown;\n  badgeStage.textContent=s.name;\n  rangeHint.textContent=`Year ${yShown} of ${TOTAL}`;\n  input.setAttribute('aria-valuetext',`Year ${yShown} of 40, ${s.name.toLowerCase()}`);\n  if(idx!==curStage){ curStage=idx; renderPanel(idx); }\n  prevBtn.disabled=(idx===0);\n  nextBtn.disabled=(idx===STAGES.length-1);\n}\n\nfunction setYear(y,announce){\n  year=clamp(y,0,TOTAL);\n  input.value=year;\n  updateThumb();\n  updateReadouts();\n}\n\ninput.addEventListener('input',()=>{ stopPlay(); setYear(parseFloat(input.value)); });\n\n// animated travel to a target year at 1.5 years/sec... actually 1.5x speed\nlet playRAF=null;\nfunction stopPlay(){ if(playRAF){ cancelAnimationFrame(playRAF); playRAF=null; } }\nfunction playTo(target){\n  stopPlay();\n  const speed=1.5*4;           // years per second (1.5x of a 4 yr/s base)\n  let last=performance.now();\n  function tick(now){\n    const dt=(now-last)/1000; last=now;\n    const dir=Math.sign(target-year);\n    let ny=year+dir*speed*dt;\n    if((dir>0&&ny>=target)||(dir<0&&ny<=target)||dir===0){ setYear(target,true); playRAF=null; return; }\n    setYear(ny);\n    playRAF=requestAnimationFrame(tick);\n  }\n  playRAF=requestAnimationFrame(tick);\n}\nprevBtn.addEventListener('click',()=>{\n  const idx=stageIndexFor(year);\n  if(idx>0) playTo(STAGES[idx-1].center);\n});\nnextBtn.addEventListener('click',()=>{\n  const idx=stageIndexFor(year);\n  if(idx<STAGES.length-1) playTo(STAGES[idx+1].center);\n});\n\n// init\nresize();\nsetYear(0);\n// keep thumb aligned after fonts/layout settle\nwindow.addEventListener('resize',()=>{ resize(); updateThumb(); });\nrequestAnimationFrame(safeRender);\n\n/* ---------------------------------------------------------------\n   AUDIO — procedural ambience (no external files)\n   ocean wave wash always; occasional gulls; louder near shore\n--------------------------------------------------------------- */\nlet AC=null, master=null, muted=false, audioReady=false;\nlet waveGain=null, gullTimer=null;\nconst MASTER_VOL=0.30;\n\nfunction buildNoiseBuffer(){\n  const len=AC.sampleRate*4;\n  const buf=AC.createBuffer(1,len,AC.sampleRate);\n  const d=buf.getChannelData(0);\n  let last=0;\n  for(let i=0;i<len;i++){        // brown-ish noise\n    const w=Math.random()*2-1;\n    last=(last+0.02*w)/1.02; d[i]=last*3.2;\n  }\n  return buf;\n}\nfunction startAudio(){\n  if(audioReady) { if(AC.state==='suspended') AC.resume(); return; }\n  try{\n    AC=new (window.AudioContext||window.webkitAudioContext)();\n  }catch(e){ return; }\n  audioReady=true;\n  master=AC.createGain();\n  master.gain.value=muted?0:MASTER_VOL;\n  master.connect(AC.destination);\n\n  // --- ocean: looping noise -> lowpass, slow swell LFO on gain ---\n  const src=AC.createBufferSource();\n  src.buffer=buildNoiseBuffer(); src.loop=true;\n  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520; lp.Q.value=0.6;\n  waveGain=AC.createGain(); waveGain.gain.value=0.5;\n  src.connect(lp); lp.connect(waveGain); waveGain.connect(master);\n  src.start();\n  // swell LFO (waves rolling)\n  const lfo=AC.createOscillator(); lfo.frequency.value=0.12;\n  const lfoGain=AC.createGain(); lfoGain.gain.value=0.28;\n  lfo.connect(lfoGain); lfoGain.connect(waveGain.gain); lfo.start();\n\n  scheduleGull();\n}\nfunction scheduleGull(){\n  if(!audioReady) return;\n  const idx=stageIndexFor(year);\n  // gulls more likely in development & O&M (near shore, quiet), rare mid-construction\n  const base=(idx===0||idx===2)?1:0.45;\n  const delay=(4 + Math.random()*10)/base;\n  gullTimer=setTimeout(()=>{ gull(); scheduleGull(); }, delay*1000);\n}\nfunction gull(){\n  if(!audioReady||AC.state!=='running') return;\n  const t=AC.currentTime;\n  const calls=1+Math.floor(Math.random()*3);\n  for(let c=0;c<calls;c++){\n    const t0=t+c*0.22;\n    const o=AC.createOscillator(); o.type='sawtooth';\n    const f0=760+Math.random()*260;\n    o.frequency.setValueAtTime(f0,t0);\n    o.frequency.linearRampToValueAtTime(f0*1.5,t0+0.06);\n    o.frequency.linearRampToValueAtTime(f0*0.85,t0+0.18);\n    const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1400; bp.Q.value=4;\n    const g=AC.createGain();\n    g.gain.setValueAtTime(0,t0);\n    g.gain.linearRampToValueAtTime(0.18,t0+0.03);\n    g.gain.exponentialRampToValueAtTime(0.001,t0+0.2);\n    o.connect(bp); bp.connect(g); g.connect(master);\n    o.start(t0); o.stop(t0+0.25);\n  }\n}\n// keep ocean level tied to how much sea/shore is in focus (subtle)\n(function audioTick(){\n  if(audioReady && waveGain && !muted){\n    const idx=stageIndexFor(year);\n    const target=(idx===1||idx===3)?0.62:0.5;   // busier stages a touch louder\n    waveGain.gain.setTargetAtTime? waveGain.gain.setTargetAtTime(target,AC.currentTime,1.5):0;\n  }\n  setTimeout(audioTick,1200);\n})();\n\nconst muteBtn=document.getElementById('muteBtn');\nconst ICON_ON='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 5 6 9H2v6h4l5 4z\"/><path d=\"M15.5 8.5a5 5 0 0 1 0 7\"/><path d=\"M18.5 5.5a9 9 0 0 1 0 13\"/><\u002Fsvg>';\nconst ICON_OFF='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 5 6 9H2v6h4l5 4z\"/><line x1=\"22\" y1=\"9\" x2=\"16\" y2=\"15\"/><line x1=\"16\" y1=\"9\" x2=\"22\" y2=\"15\"/><\u002Fsvg>';\nif(muteBtn){\n  muteBtn.innerHTML=ICON_ON;\n  muteBtn.addEventListener('click',()=>{\n    muted=!muted;\n    if(master) master.gain.setTargetAtTime(muted?0:MASTER_VOL, AC.currentTime, 0.05);\n    muteBtn.innerHTML=muted?ICON_OFF:ICON_ON;\n    muteBtn.setAttribute('aria-pressed',muted);\n    muteBtn.setAttribute('aria-label',muted?'Unmute sound':'Mute sound');\n    if(!muted) startAudio();\n  });\n}\nwindow.__startAudio=startAudio;\n})();\n<\u002Fscript>\n<script>\n(function(){\n  var cover=document.getElementById('cover');\n  var btn=document.getElementById('coverStart');\n  if(!cover||!btn) return;\n  function dismiss(){\n    cover.classList.add('leaving');\n    document.body.classList.remove('cover-on');\n    if(window.__startAudio) window.__startAudio();\n    var slider=document.getElementById('year');\n    setTimeout(function(){\n      cover.style.display='none';\n      if(slider) slider.focus();\n    },520);\n  }\n  btn.addEventListener('click',dismiss);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
